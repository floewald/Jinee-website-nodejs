name: Documentation links

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          # Development-server URLs are valid documentation, but do not exist on GitHub runners.
          # Public links, including video links, remain checked.
          args: --verbose --no-progress --exclude-loopback README.md CONTRIBUTING.md CLAUDE.md AGENTS.md docs/**/*.md
          format: markdown
          output: lychee/out.md
          fail: true
          jobSummary: true
