name: Build & Deploy

# Trigger: push to main branch, or manually via GitHub UI (Actions → Run workflow)
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      clean_slate:
        description: 'Wipe server dir before uploading (use after a server wipe or partial deploy)'
        required: false
        default: false
        type: boolean

jobs:
  # Detects whether assets-raw/ changed in this push.
  # Runs in parallel with build-and-deploy — adds zero latency to the critical path.
  # Outputs `assets_changed` consumed by deploy-assets and deploy-raw-assets.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      assets_changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect assets-raw changes
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.clean_slate }}" == "true" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Forced: clean-slate workflow_dispatch"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            CHANGED=$(git show --name-only --format="" HEAD)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null || echo "")
          fi
          # Trigger when source images changed OR when portfolio content/manifests changed.
          # The second condition catches "new project added" pushes where only JSON manifests
          # are committed but new WebP files are still needed on the server.
          if echo "$CHANGED" | grep -qE 'assets-raw/|src/content/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Asset-relevant changes detected (assets-raw/ or src/content/)"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No asset-relevant changes — skipping asset deploys"
          fi

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js (must match your local version)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Install JavaScript dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build the static site → produces the out/ directory
      #    Lint + unit tests run locally in the Husky pre-push hook to avoid
      #    burning GitHub Action minutes on every deploy-triggering push.
      #    images.json manifests are committed to git, so validate:manifests works
      #    without regenerating images. Heavy image files are handled by deploy-assets.
      - name: Build static site
        run: npm run validate:manifests && npm run build:next
        env:
          NODE_ENV: production

      # 5. Log build structure (runs before verify so it's always visible in the Actions log,
      #    even if verification fails — critical for debugging)
      - name: Log build structure
        run: |
          echo "=== out/ top-level ==="
          ls -la out/
          echo "=== out/_next/static/ ==="
          ls -la out/_next/static/
          echo "=== chunks ($(find out/_next/static/chunks/ -type f 2>/dev/null | wc -l | tr -d ' ') files) ==="
          ls out/_next/static/chunks/ 2>/dev/null | head -20 || echo "(missing)"
          echo "=== .css files in chunks ==="
          find out/_next/static/chunks/ -name '*.css' 2>/dev/null || echo "(none)"

      # 6. Verify the build produced a valid static site structure
      #    NOTE: Next.js with Tailwind v4 bundles CSS into chunks/ as .css files —
      #    there is no separate static/css/ directory in this project.
      - name: Verify build output
        run: |
          fail() { echo "::error::$1" && exit 1; }
          [ -d out/ ]                             || fail "Build failed: out/ directory missing"
          [ -f out/index.html ]                   || fail "Build failed: out/index.html not found"
          [ -d out/_next/static/chunks/ ]         || fail "Build failed: out/_next/static/chunks/ missing"
          [ -n "$(ls out/_next/static/chunks/)" ] || fail "Build failed: out/_next/static/chunks/ is empty"
          CSS_COUNT=$(find out/_next/static/chunks/ -name '*.css' | wc -l | tr -d ' ')
          [ "$CSS_COUNT" -gt 0 ]                 || fail "Build failed: no .css files found in chunks/"
          echo "Build OK — $(find out/ -type f | wc -l | tr -d ' ') files"
          echo "  chunks: $(find out/_next/static/chunks/ -type f | wc -l | tr -d ' ') files"
          echo "  css:    $CSS_COUNT .css files in chunks/"

      # 7. Warn if Git LFS objects are approaching the 1 GB free-tier limit (90 % = 900 MB).
      #    This is a no-op when LFS is not in use; activates automatically if LFS is adopted.
      - name: Check Git LFS storage usage
        run: |
          if [ -d .git/lfs/objects ]; then
            USED=$(du -sb .git/lfs/objects | cut -f1)
            LIMIT=$((900 * 1024 * 1024))
            if [ "$USED" -gt "$LIMIT" ]; then
              echo "::warning title=Git LFS quota::LFS objects exceed 90% of the 1 GB free tier (${USED} bytes used). Consider upgrading storage: https://docs.github.com/en/billing/managing-billing-for-git-large-file-storage"
            fi
          fi

      # 8. Deploy out/ to the FTP server
      #    Credentials are stored in GitHub repository Secrets (Settings → Secrets and variables → Actions)
      #    Use workflow_dispatch with clean_slate=true after a server wipe or partial deploy.
      #    WARNING: clean_slate=true deletes all files in server-dir first — assets will be
      #    wiped too, so only use it when you intend a full redeploy (deploy-assets must also run).
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Only upload changed files (faster incremental deploys)
          state-name: .ftp-deploy-sync-state.json
          # Set to true via workflow_dispatch to recover from a server wipe or partial deploy
          dangerous-clean-slate: ${{ github.event.inputs.clean_slate == 'true' }}
          # Exclude the heavy assets/ folder from automatic sync
          # (assets only need re-uploading when you add/change images;
          #  see the conditional job below for that)
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            assets/**

  # Regenerates WebP images and uploads to www/assets/ when assets-raw/ has changed.
  deploy-assets:
    runs-on: ubuntu-latest
    needs: [build-and-deploy, detect-changes]
    if: needs.detect-changes.outputs.assets_changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build images
        run: npm run build:images

      # build:images writes directly to public/assets/ — no build:next needed here
      - name: Upload assets via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/assets/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}assets/
          state-name: .ftp-deploy-assets-sync-state.json

  # Uploads original source images to private/assets-raw/ when assets-raw/ has changed.
  # These are the high-resolution originals served by the password-protected download system.
  deploy-raw-assets:
    runs-on: ubuntu-latest
    needs: [build-and-deploy, detect-changes]
    if: needs.detect-changes.outputs.assets_changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload raw assets via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./assets-raw/
          server-dir: ${{ secrets.FTP_BACKEND_DIR }}assets-raw/
          state-name: .ftp-deploy-raw-assets-state.json

  # Generates backend config files from committed templates by injecting
  # credentials stored as GitHub Secrets, then uploads via FTP.
  # This way the repo can be public — no credentials ever touch git.
  deploy-backend-config:
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Secrets are passed as env-vars and substituted using Python str.replace()
      # so special characters are handled safely.
      - name: Generate backend config files from templates
        env:
          DL_PASS_WALKING_TOUR_LITTLE_INDIA: ${{ secrets.DL_PASS_WALKING_TOUR_LITTLE_INDIA }}
          DL_PASS_20260124_WEST_SIDE_ART_TOUR: ${{ secrets.DL_PASS_20260124_WEST_SIDE_ART_TOUR }}
          DL_PASS_20260201_MEDIACORP_2026_CNY_ROAD_SHOW: ${{ secrets.DL_PASS_20260201_MEDIACORP_2026_CNY_ROAD_SHOW }}
          CONTACT_RECIPIENT: ${{ secrets.CONTACT_RECIPIENT }}
          CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL }}
          CONTACT_FROM_NAME: ${{ secrets.CONTACT_FROM_NAME }}
          CONTACT_SMTP_HOST: ${{ secrets.CONTACT_SMTP_HOST }}
          CONTACT_SMTP_PORT: ${{ secrets.CONTACT_SMTP_PORT }}
          CONTACT_SMTP_USER: ${{ secrets.CONTACT_SMTP_USER }}
          CONTACT_SMTP_PASS: ${{ secrets.CONTACT_SMTP_PASS }}
          CONTACT_SMTP_SECURE: ${{ secrets.CONTACT_SMTP_SECURE }}
        run: |
          mkdir -p /tmp/backend-config
          mkdir -p /tmp/backend-contact
          python3 - <<'PYEOF'
          import os

          # download_config.php (private/download)
          with open('backend/download/download_config.template.php') as f:
              content = f.read()
          content = content.replace(
              '%%DL_PASS_WALKING_TOUR_LITTLE_INDIA%%',
              os.environ['DL_PASS_WALKING_TOUR_LITTLE_INDIA'])
          content = content.replace(
              '%%DL_PASS_20260124_WEST_SIDE_ART_TOUR%%',
              os.environ['DL_PASS_20260124_WEST_SIDE_ART_TOUR'])
          content = content.replace(
              '%%DL_PASS_20260201_MEDIACORP_2026_CNY_ROAD_SHOW%%',
              os.environ['DL_PASS_20260201_MEDIACORP_2026_CNY_ROAD_SHOW'])
          with open('/tmp/backend-config/download_config.php', 'w') as f:
              f.write(content)

          # contact/config.php (public backend/contact)
          with open('backend/contact/config.template.php') as f:
              contact = f.read()
          contact = contact.replace('%%CONTACT_RECIPIENT%%', os.environ['CONTACT_RECIPIENT'])
          contact = contact.replace('%%CONTACT_FROM_EMAIL%%', os.environ['CONTACT_FROM_EMAIL'])
          contact = contact.replace('%%CONTACT_FROM_NAME%%', os.environ['CONTACT_FROM_NAME'])
          contact = contact.replace('%%CONTACT_SMTP_HOST%%', os.environ['CONTACT_SMTP_HOST'])
          contact = contact.replace('%%CONTACT_SMTP_PORT%%', os.environ['CONTACT_SMTP_PORT'])
          contact = contact.replace('%%CONTACT_SMTP_USER%%', os.environ['CONTACT_SMTP_USER'])
          contact = contact.replace('%%CONTACT_SMTP_PASS%%', os.environ['CONTACT_SMTP_PASS'])
          contact = contact.replace('%%CONTACT_SMTP_SECURE%%', os.environ['CONTACT_SMTP_SECURE'])
          with open('/tmp/backend-contact/config.php', 'w') as f:
              f.write(contact)
          PYEOF

      # Uploads generated configs to subfolders of FTP_BACKEND_DIR.
      # FTP_BACKEND_DIR must end with /  (e.g. private/)
      # → download_config.php lands at  FTP_BACKEND_DIR/download/
      # → contact/config.php    lands at  FTP_BACKEND_DIR/contact/
      - name: Upload download_config.php via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: /tmp/backend-config/
          server-dir: ${{ secrets.FTP_BACKEND_DIR }}download/
          state-name: .ftp-deploy-backend-config-state.json
          dangerous-clean-slate: false

      - name: Upload contact config.php via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: /tmp/backend-contact/
          server-dir: ${{ secrets.FTP_BACKEND_DIR }}contact/
          state-name: .ftp-deploy-contact-config-state.json
          dangerous-clean-slate: false

  # Deploys PHP scripts, vendor (PHPMailer), and .htaccess from backend/ to www/backend/.
  # Credential config files are intentionally excluded — they are handled by the
  # deploy-backend-config job above. dangerous-clean-slate is always false here:
  # setting it to true would delete config.php (uploaded by deploy-backend-config)
  # because that file is excluded from the local dir.
  deploy-backend-php:
    runs-on: ubuntu-latest
    needs: deploy-backend-config

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend PHP scripts via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}backend/
          state-name: .ftp-deploy-backend-php-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/config.php
            **/config.template.php
            **/config.example.php
            **/download_config.php
            **/download_config.template.php
            **/logs/*.log
            **/rate-limit/**
            **/tmp/**
